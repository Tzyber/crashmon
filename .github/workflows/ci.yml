name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Third-Party-Actions auf Commit-SHAs gepinnt (Supply-Chain-Haertung,
      # Security-Review-Befund) — Tags/Branches sind mutierbar.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Nutzt rust-toolchain.toml (1.95.0)
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      # systemd-Crate linkt gegen libsystemd
      - name: Install systemd dev headers
        run: sudo apt-get update && sudo apt-get install -y libsystemd-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test (daemon)
        run: cargo test

      - name: check (gui)
        run: cargo check -p crashmon-gui
