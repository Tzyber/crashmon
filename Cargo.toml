[package]
name = "crash-daemon"
version = "0.1.0"
edition = "2024"

# k2-Fix: Binary heisst "crashmon" (systemd-Unit: ExecStart=/usr/bin/crashmon,
# README-Quickstart, find_daemon_bin der GUI). Der Package-Name bleibt
# "crash-daemon" — die Lib heisst crash_daemon, GUI-Import unveraendert.
[[bin]]
name = "crashmon"
path = "src/main.rs"

# GUI als separates Workspace-Member-Crate: eframe zieht ~200 Crates —
# default-members haelt plain `cargo build`/`cargo test` im Root beim Daemon.
[workspace]
members = ["crashmon-gui"]
default-members = ["."]
resolver = "3"

# GUI-Dev-Komfort: Optimierung fuer alle Transitiven (eframe-Baum),
# eigene Debug-Builds bleiben schnell.
[profile.dev.package."*"]
opt-level = 2

# Abhaengigkeiten exakt gepinnt (=): kein API-Drift bei cargo update.
# Besonders systemd (lucab) — Journal-API (Seek/Cursor) ist versionsabhaengig.
# Tokio-Features bewusst minimal (current_thread, kein rt-multi-thread):
#   rt      — current_thread-Runtime + LocalSet (!Send-Futures)
#   macros  — #[tokio::main], select!
#   signal  — SIGTERM/ctrl_c
#   sync    — bounded mpsc (Phase 2.4)
#   time    — Interval/Timer
#   net     — nur fuer tokio::io::unix::AsyncFd (sd_journal-FD, Phase 2.2)

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
libc = "=0.2.189"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
systemd = "=0.10.1"
tokio = { version = "=1.53.1", features = ["rt", "macros", "signal", "sync", "time", "net"] }
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
